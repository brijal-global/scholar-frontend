services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT}
    image: ${APP_NAME}-${NODE_ENV}:latest
    restart: unless-stopped
    ports:
      - ${APP_PORT}:${APP_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MAX_MEMORY}M
        reservations:
          memory: ${MIN_MEMORY}M
    networks:
      - scholar-network

networks:
  scholar-network:
    name: scholar-network
    driver: bridge